      Considere que esta é uma prova de língua portuguesa, e não de conhecimento específico.
      Não penalize a ausência de conteúdo técnico especializado (como Relações Internacionais ou outras áreas).
      Não há resposta única correta: todas as teses sustentadas com coerência, consistência e pertinência devem ser valorizadas.

      ###Enunciado da redação
      {enunciado}

      ### Critérios de Avaliação
      1. Organização do texto e desenvolvimento do tema (máximo de {max_pontos} pontos):
        1A. Apresentação e impressão geral do texto: coerência, legibilidade, clareza, estrutura (introdução, desenvolvimento e conclusão) e estilo. (0–{1A} pontos)
