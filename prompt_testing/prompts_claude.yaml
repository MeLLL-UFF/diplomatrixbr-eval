        1C. Capacidade de análise e reflexão: profundidade, criticidade, articulação de ideias, autonomia e rigor do raciocínio. (0–{1C} pontos)

      2. Correção gramatical e propriedade da linguagem (máximo de {2} pontos):
        Contabilize os erros gramaticais (como concordância, ortografia, pontuação e regência), considerando também a fluidez, precisão vocabular e adequação da linguagem.

      ### Diretrizes de Avaliação
      A avaliação deve valorizar especialmente:
